# Loaded only with `mise -E secrets bootstrap`, after the GPG keys are imported.
# Every source below is a git-crypt encrypted file (see .gitattributes); this
# file holds paths only, never secret values.

# mise clones repos before it deploys dotfiles, but cloning pass needs the SSH
# key. So: unlock git-crypt (no-op when unlocked, fails the run when it can't),
# then deploy just the SSH key ahead of the repos phase.
[bootstrap.hooks.pre-repos]
description = "Unlock git-crypt and deploy the SSH key"
run = [
  "mise run dot:git-crypt:unlock",
  "mise -E secrets dotfiles apply --yes ~/.ssh/id_rsa ~/.ssh/id_rsa.pub",
]

# The first clone is over HTTPS (no key yet); push over SSH from now on
[bootstrap.hooks.post-dotfiles]
description = "Point the dotfiles remote at SSH"
run = "git -C ~/dotfiles remote set-url origin git@github.com:jollopre/dotfiles.git"

[bootstrap.repos]
"~/github/pass" = { url = "git@github.com:jollopre/pass.git" }

[dotfiles]
"~/.password-store" = { source = "~/github/pass" }
"~/.aws/config" = { source = "~/dotfiles/work/.aws/config" }
"~/.extended-routes" = { source = "~/dotfiles/work/.extended-routes" }
"~/.aliases.sh" = { source = "~/dotfiles/work/.aliases.sh" }
"~/.gitconfig-work" = { source = "~/dotfiles/work/.gitconfig" }
# Copies, not symlinks: they need their own permissions, and the tools rewrite
# them (glab stores tokens), which must not leak back into the repo
"~/.ssh/id_rsa" = { source = "~/dotfiles/.ssh/id_rsa", mode = "copy", permissions = "0600" }
"~/.ssh/id_rsa.pub" = { source = "~/dotfiles/.ssh/id_rsa.pub", mode = "copy", permissions = "0644" }
# Seed only: glab refreshes tokens in place, so never overwrite the live file
"~/Library/Application Support/glab-cli/config.yml" = { source = "~/dotfiles/work/glab-cli/config.yml", mode = "copy", permissions = "0600", create_if_missing = true }
"~/.config/cloudflared-proxy/config.yaml" = { source = "~/dotfiles/work/cloudflared-proxy/config.yaml", mode = "copy", permissions = "0600" }
